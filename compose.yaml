# =============================================================================
# Orquestación Podman / Docker Compose — Plataforma Renatx (renatx.com)
# Autor: Franco Renato Palavecino
# =============================================================================

name: renatx-platform

services:
  # ---------------------------------------------------------------------------
  # 1. Proxy Inverso: Traefik v3 (Sin montar socket privilegiado)
  # ---------------------------------------------------------------------------
  traefik:
    image: docker.io/library/traefik:v3.1
    container_name: renatx-traefik
    restart: unless-stopped
    ports:
      # En local rootless usa 8080 por defecto (configurable en .env con HTTP_PORT).
      # En VPS con sysctl net.ipv4.ip_unprivileged_port_start=80 usa HTTP_PORT=80.
      - "${HTTP_PORT:-8080}:80"
      - "8081:8080" # Dashboard de Traefik en http://traefik.renatx.localhost:8081
    volumes:
      - ./infra-platform/traefik/traefik.yml:/etc/traefik/traefik.yml:ro,Z
      - ./infra-platform/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro,Z
    networks:
      - proxy_net
    depends_on:
      - service-api
      - service-web

  # ---------------------------------------------------------------------------
  # 2. Base de Datos: PostgreSQL 16 Alpine (Aislada en red interna db_net)
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: renatx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renatx_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renatx_local_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-renatx_db}
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    networks:
      - db_net
    # SEGURIDAD: Prohibido exponer 'ports:' (5432) al host público.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renatx_admin} -d ${POSTGRES_DB:-renatx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Backend API: Python 3.12 + FastAPI + uv
  # ---------------------------------------------------------------------------
  service-api:
    build:
      context: ./service-api
      dockerfile: Containerfile
    container_name: renatx-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxy_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Frontend Web: Next.js App Router (Interfaz Didáctica Renatx)
  # ---------------------------------------------------------------------------
  service-web:
    build:
      context: ./service-web
      dockerfile: Containerfile
    container_name: renatx-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_ENV: ${ENV:-local}
      NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN:-renatx.localhost}
    networks:
      - proxy_net
    depends_on:
      - service-api

# -----------------------------------------------------------------------------
# Redes Segmentadas
# -----------------------------------------------------------------------------
networks:
  proxy_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true # Aísla PostgreSQL de Internet y del tráfico directo externo

# -----------------------------------------------------------------------------
# Volúmenes Persistentes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
    name: renatx_pgdata
