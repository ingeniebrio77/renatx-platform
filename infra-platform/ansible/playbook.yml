---
# =============================================================================
# Playbook Ansible — Aprovisionamiento Base + Podman Rootless + UFW
# Destino: Debian 12 (Bookworm) / Ubuntu 24.04 LTS en Hetzner Cloud u OVH
# Autor: Franco Renato Palavecino (Renatx)
# =============================================================================

- name: Aprovisionar Servidor Linux con Podman Rootless para Renatx Platform
  hosts: all
  become: true

  vars:
    deploy_user: renatx
    allowed_tcp_ports:
      - "22"
      - "80"
      - "443"

  tasks:
    - name: 1. Actualizar caché APT e instalar paquetes esenciales y Podman
      ansible.builtin.apt:
        name:
          - podman
          - podman-compose
          - slirp4netns
          - uidmap
          - dbus-user-session
          - fuse-overlayfs
          - ufw
          - fail2ban
          - git
          - curl
          - make
        state: present
        update_cache: true

    - name: 2. Crear usuario administrativo sin privilegios para contenedores (rootless)
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: 3. Permitir a Podman rootless escuchar en puertos >= 80 (HTTP/HTTPS)
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "80"
        sysctl_set: true
        state: present
        reload: true

    - name: 4. Activar systemd linger para que los contenedores rootless sobrevivan al logout SSH
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ deploy_user }}"
        creates: "/var/lib/systemd/linger/{{ deploy_user }}"

    - name: 5. Endurecer SSH (Deshabilitar login por contraseña)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Reiniciar SSH

    - name: 6. Configurar Firewall UFW (22/tcp, 80/tcp, 443/tcp, 443/udp)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ allowed_tcp_ports }}"

    - name: 7. Permitir HTTP/3 (QUIC) en 443/udp
      community.general.ufw:
        rule: allow
        port: "443"
        proto: udp

    - name: 8. Activar UFW con política por defecto DENY incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: Reiniciar SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
