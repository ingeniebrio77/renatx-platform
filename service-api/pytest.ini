[pytest]
# Configuración de pytest para service-api
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    unit: tests unitarios rápidos
    integration: tests de integración
    slow: tests lentos (>1s)
    security: tests de seguridad

# Opciones de salida
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    -ra

