# =============================================================================
# Orquestación Podman / Docker Compose — Servidor Privado RustDesk (hbbs + hbbr)
# Uso local o en instancia efímera por horas (support.renatx.com)
# =============================================================================

name: renatx-rustdesk

services:
  hbbs:
    image: docker.io/rustdesk/rustdesk-server:latest
    container_name: renatx-rustdesk-hbbs
    # '-r' define el relay server y '-k _' exige obligatoriamente la clave pública Ed25519
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-renatx.localhost}:21117 -k _
    volumes:
      - ./infra-platform/rustdesk/data:/root:Z
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: docker.io/rustdesk/rustdesk-server:latest
    container_name: renatx-rustdesk-hbbr
    command: hbbr -k _
    volumes:
      - ./infra-platform/rustdesk/data:/root:Z
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped
